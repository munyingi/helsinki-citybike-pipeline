version: 2

models:
  - name: fct_trips
    description: Valid city bike trips (Helsinki + Espoo). One row per trip.
    columns:
      - name: trip_id
        description: Hash of the trip's identifying fields.
        data_tests: [unique, not_null]
      - name: departed_at
        description: Departure time, local Helsinki time.
        data_tests: [not_null]
      - name: trip_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: departure_station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_id
      - name: return_station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_id
      - name: duration_s
        description: Trip duration in seconds.
        data_tests:
          - value_between:
              arguments:
                min_value: "{{ var('min_trip_seconds') }}"
                max_value: "{{ var('max_trip_seconds') }}"
      - name: distance_m
        description: Distance the bike travelled in metres, as reported by the operator.
      - name: departure_hour
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 23

  - name: dim_station
    description: One row per station id seen in valid trips.
    columns:
      - name: station_id
        data_tests: [unique, not_null]
      - name: station_name
        description: Most recently used name for the station.
        data_tests: [not_null]
      - name: city
        description: Helsinki or Espoo from HSL's station list; Other for workshop and test stations.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Helsinki", "Espoo", "Other"]
      - name: lat
        description: Latitude (WGS84) from HSL's 2021 station list. Null if the id is not in the list.
        data_tests:
          - value_between:
              arguments:
                min_value: 60.0
                max_value: 60.5
      - name: lon
        data_tests:
          - value_between:
              arguments:
                min_value: 24.5
                max_value: 25.5

  - name: dim_date
    description: Calendar 2021-2026 with Finnish holidays, special days and FMI weather (Kaisaniemi).
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: precipitation_mm
        description: Daily rain in mm. FMI's -1 ("no rain at all") is stored as 0.
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 200
      - name: temp_mean_c
        data_tests:
          - value_between:
              arguments:
                min_value: -45
                max_value: 40
      - name: is_rainy_day
        description: "True when precipitation_mm >= var('rainy_day_mm') (1 mm)."

  - name: agg_daily_trips
    description: One row per day with trips, weather and calendar. Safe to publish (no trip-level data).
    columns:
      - name: trip_date
        data_tests: [unique, not_null]
      - name: trips
        data_tests:
          - value_between:
              arguments:
                min_value: 1
                max_value: 100000

  - name: agg_hourly_trips
    description: Trips per date and departure hour. Safe to publish.

  - name: agg_station_daily
    description: Departures, arrivals and net flow per station per day. Safe to publish.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["trip_date", "station_id"]

  - name: agg_trip_types
    description: Trips by duration band, distance band, round trip or not, day off or not, per month. Safe to publish.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["year", "month", "is_day_off", "duration_band", "distance_band", "is_round_trip"]
    columns:
      - name: trips
        data_tests: [not_null]

  - name: agg_od_pairs
    description: Station-to-station routes per year with at least 10 trips. Safe to publish.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["year", "departure_station_id", "return_station_id"]
    columns:
      - name: trips
        data_tests:
          - value_between:
              arguments:
                min_value: 10
                max_value: 1000000

  - name: agg_city_flows
    description: Trips per year between and within Helsinki and Espoo. Safe to publish.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["year", "departure_city", "return_city"]

exposures:
  - name: citybike_dashboard
    type: dashboard
    maturity: low
    url: https://github.com/munyingi
    description: Streamlit dashboard (dashboard/app.py) built on exported aggregate tables.
    depends_on:
      - ref('agg_daily_trips')
      - ref('agg_hourly_trips')
      - ref('agg_station_daily')
      - ref('dim_station')
      - ref('agg_trip_types')
      - ref('agg_od_pairs')
      - ref('agg_city_flows')
    owner:
      name: Samwel Munyingi
