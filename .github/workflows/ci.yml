# Runs on every push and pull request. Uses DuckDB + synthetic fixtures, so it
# keeps working after the Snowflake trial ends and needs no secrets.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: ${{ github.workspace }}/data/citybike.duckdb
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python files compile
        run: python -m compileall -q ingestion scripts dashboard

      - name: Load synthetic fixtures through the real parsers
        run: python scripts/load_fixtures_duckdb.py

      - name: dbt build (models + tests)
        working-directory: dbt
        run: dbt build --target ci --profiles-dir .

      - name: Dashboard smoke test
        run: |
          python scripts/export_marts.py --target duckdb
          python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('dashboard/app.py', default_timeout=60).run(); assert not at.exception, at.exception; print('dashboard ok')"
